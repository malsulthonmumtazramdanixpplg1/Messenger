<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesan Spesial Untukmu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card-container">
    <div class="heart-icon">❤️</div>
    <h1 id="title">Hai <span class="highlight">[Nama Dia]</span>...</h1>
    
    <div class="message-box">
      <p id="typing-text"></p>
    </div>

    <!-- Tombol Pilihan Interaktif -->
    <div class="action-buttons" id="btn-group">
      <button id="yesBtn" class="btn btn-yes">Mau Banget! 💕</button>
      <button id="noBtn" class="btn btn-no">Enggak Dulu 😜</button>
    </div>

    <!-- Pesan Rahasia kalau diklik "Iya" -->
    <div id="successMessage" class="hidden">
      <h2>Yayy! Momen Baru Dimulai 🎉</h2>
      <p>Makasih ya udah kasih kesempatan lagi. Aku bakal usahain yang terbaik kali ini!</p>
      <a href="https://wa.me/6281234567890?text=Halo!%20Aku%20udah%20baca%20webnya%20nih..." class="btn btn-wa">Chat Aku di WhatsApp 📱</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
